name: NOX REMOTE - Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  noxvf:
    name: Fabrication NOX VF (doublage FR)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper ctranslate2 sentencepiece piper-tts sherpa-onnx sounddevice webrtcvad-wheels numpy requests pyinstaller
      - name: Test des imports
        run: |
          python -c "import faster_whisper, ctranslate2, sentencepiece, sherpa_onnx, sounddevice, webrtcvad, numpy, requests; from piper import PiperVoice; print('OK')"
      - name: PyInstaller
        run: |
          copy gui\chiaking.ico noxvf\noxvf.ico
          pyinstaller --noconfirm --windowed --name "NOX VF" --icon noxvf\noxvf.ico --add-data "noxvf\noxvf.ico;." --collect-all faster_whisper --collect-all ctranslate2 --collect-all piper --collect-all onnxruntime --collect-all sentencepiece --collect-all webrtcvad --collect-all sounddevice --collect-all sherpa_onnx --collect-data _sounddevice_data noxvf\noxvf.py
      - name: Test de l'exe (demarre et se ferme)
        run: |
          $p = Start-Process "dist\NOX VF\NOX VF.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { echo "NOX VF a plante au demarrage (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          echo "NOX VF demarre bien"
      - uses: actions/upload-artifact@v4
        with:
          name: noxvf
          path: dist/NOX VF

  build-win_x64:
    name: Fabrication NOX REMOTE
    needs: noxvf
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      VCPKG_KEEP_ENV_VARS: "CMAKE_POLICY_VERSION_MINIMUM"
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      vcpkg_baseline: 9ee11c38b14f8d0c6cca9a0c6f8a5d6a0859867f
      dep_folder: deps
      libplacebo_tag: v7.387.0
      sdl2_compat_tag: 2.32.74

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = (Invoke-WebRequest -UseBasicParsing -Uri "https://vulkan.lunarg.com/sdk/latest.json" | ConvertFrom-Json).windows
          echo Version $ver
          Invoke-WebRequest -UseBasicParsing -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }}  --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          version: "6.12.0"
          host: 'windows'
          target: 'desktop'
          modules: 'qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Petite page Sony integree (Qt WebEngine, seulement si compatible)
        id: webengine
        continue-on-error: true
        run: |
          $qtroot = $env:QT_ROOT_DIR
          $ver = Split-Path (Split-Path $qtroot -Parent) -Leaf
          $out = Split-Path (Split-Path $qtroot -Parent) -Parent
          $arch = Split-Path $qtroot -Leaf
          # 1) essai dans un dossier a part (le vrai Qt n'est jamais touche si ca ne va pas)
          python -m aqt install-qt windows desktop $ver win64_msvc2022_64 --outputdir C:\qt-essai -m qtwebengine qtpdf
          $test = "C:\qt-essai\$ver\$arch\bin"
          python -m pip install --quiet pefile
          python scripts\check_qt_abi.py $test
          if ($LASTEXITCODE -ne 0) { echo "WebEngine pas compatible -> connexion PSN dans le navigateur"; exit 1 }
          # 2) compatible : installation pour de vrai
          python -m aqt install-qt windows desktop $ver win64_msvc2022_64 --outputdir $out -m qtwebengine qtpdf
          echo "WebEngine OK"

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -OutFile ".\ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          Expand-Archive -LiteralPath "ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n9.0-latest-win64-gpl-shared-9.0" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Setup shaderc (depuis le Vulkan SDK)
        run: |
          $d = "${{ github.workspace }}\${{ env.dep_folder }}"
          New-Item -ItemType Directory -Force "$d\bin","$d\lib\pkgconfig","$d\include" | Out-Null
          Copy-Item "${{ env.VULKAN_SDK }}Bin\shaderc_shared.dll" "$d\bin" -Force
          Copy-Item "${{ env.VULKAN_SDK }}Lib\shaderc_shared.lib" "$d\lib" -Force
          Copy-Item "${{ env.VULKAN_SDK }}Include\shaderc" "$d\include" -Recurse -Force
          $p = $d -replace '\\','/'
          "prefix=$p`nlibdir=`${prefix}/lib`nincludedir=`${prefix}/include`n`nName: shaderc`nDescription: shaderc`nVersion: 2026.1`nLibs: -L`${libdir} -lshaderc_shared`nCflags: -I`${includedir}" | Out-File -Encoding ascii "$d\lib\pkgconfig\shaderc.pc"
          Get-Content "$d\lib\pkgconfig\shaderc.pc"

      - name: Import WebEngine pour le deploiement
        if: steps.webengine.outcome == 'success'
        run: cp scripts\qtwebengine_import.qml gui\src\qml\

      - name: Make build directory
        run: |
          mkdir build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Configure chiaki-ng
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Prepare Qt deployment package
        run: |
          mkdir chiaki-ng-Win
          cp build\gui\chiaki.exe chiaki-ng-Win
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll chiaki-ng-Win
          Get-ChildItem "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\*.dll" | Copy-Item -Destination chiaki-ng-Win -Force
          if (Test-Path "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL2.dll") { cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL2.dll" chiaki-ng-Win -Force }
          if (Test-Path "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL3.dll") { cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL3.dll" chiaki-ng-Win -Force }
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\swresample-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avcodec-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avutil-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avformat-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\libplacebo-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\shaderc_shared.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\spirv-cross-c-shared.dll" chiaki-ng-Win
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release chiaki-ng-Win\chiaki.exe
          Rename-Item chiaki-ng-Win\chiaki.exe NOX-REMOTE-2.exe

      - name: Verifier les versions Qt (anti-plantage)
        run: |
          if (Test-Path chiaki-ng-Win\Qt6WebEngineCore.dll) {
            $g = (Get-Item chiaki-ng-Win\Qt6Gui.dll).VersionInfo.ProductVersion
            $w = (Get-Item chiaki-ng-Win\Qt6WebEngineCore.dll).VersionInfo.ProductVersion
            echo "Qt6Gui=$g  Qt6WebEngineCore=$w"
            if ($g -ne $w) { echo "Versions Qt differentes"; exit 1 }
          } else { echo "Sans WebEngine" }

      - name: Package chiaki-ng
        run: |
          $CHIAKI_VERSION_MAJOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MAJOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_MINOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MINOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_PATCH = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_PATCH ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $RELEASE_PACKAGE_FILE = "chiaki-ng-win_x64-VC-portable-$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-test-build-${{ github.sha }}.zip"
          Compress-Archive chiaki-ng-Win $RELEASE_PACKAGE_FILE
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "RELEASE_PACKAGE_PATH=$release_filepath" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-win_x64-VC-Release
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Recuperer NOX VF
        uses: actions/download-artifact@v4
        with:
          name: noxvf
          path: chiaki-ng-Win/NOX VF

      - name: Fabriquer l'installeur (NSIS)
        run: |
          $mk = (Get-ChildItem "C:\Program Files (x86)\NSIS\makensis.exe","C:\Program Files\NSIS\makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $mk) { choco install nsis -y --no-progress; $mk = (Get-ChildItem "C:\Program Files (x86)\NSIS\makensis.exe").FullName }
          echo "makensis: $mk"
          & $mk "/DROOT=${{ github.workspace }}" "/DAPPDIR=${{ github.workspace }}\chiaki-ng-Win" "/DOUTFILE=${{ github.workspace }}\NOX-REMOTE-2-Installer.exe" "${{ github.workspace }}\scripts\nox-remote.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $env:RELEASE_PACKAGE_PATH NOX-REMOTE-2-Portable.zip
          Get-ChildItem NOX-REMOTE-2-Installer.exe, NOX-REMOTE-2-Portable.zip

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-win_x64-VC-installer.zip
          path: NOX-REMOTE-2-Installer.exe
          if-no-files-found: error
          retention-days: 7

      - name: Empreinte SHA-256
        run: |
          $h = (Get-FileHash NOX-REMOTE-2-Installer.exe -Algorithm SHA256).Hash
          "Installeur officiel NOX REMOTE 2 (nouvelle interface) - s'installe a cote de NOX REMOTE v19 sans la remplacer - fait par math_0235`n`nSHA-256 : $h" | Out-File -Encoding utf8 notes.txt

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: NOX REMOTE 2 (nouvelle interface) v2.${{ github.run_number }}
          files: |
            NOX-REMOTE-2-Installer.exe
            NOX-REMOTE-2-Portable.zip
          body_path: notes.txt
          make_latest: true
